<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC Copero</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        
        <!-- PANTALLA DE CREACIÓN -->
        <div id="creation-screen">
            <h1>UFC: El Camino</h1>
            <p>Crea tu peleador.</p>
            <input type="text" id="playerName" value="Máximo" placeholder="Tu nombre">
            <select id="playerSpec">
                <option value="Striker">Striker (Boxeo/Muay Thai)</option>
                <option value="Grappler">Grappler (Jiu-Jitsu/Lucha)</option>
            </select>
            <button onclick="startGame()" class="btn-primary">Iniciar Carrera</button>
        </div>

        <!-- HUB DEL JUEGO -->
        <div id="main-hub" style="display:none;">
            <div class="calendar-bar">
                <h3>🗓️ Semana: <span id="week-counter">1</span></h3>
                <h4 id="next-fight-text" class="alert-text">Próxima pelea en: 4 semanas</h4>
            </div>

            <div class="dashboard">
                <div class="card">
                    <h3>Atributos</h3>
                    <p>💪 Condición Fís.: <span id="stat-cond">100</span>%</p>
                    <p>🥊 Striking: <span id="stat-str">10</span></p>
                    <p>🥋 Grappling: <span id="stat-gra">10</span></p>
                    <hr>
                    <p>🏆 Récord: <span id="stat-record">0-0</span></p>
                </div>
                
                <div class="card actions-card">
                    <h3>Plan Semanal</h3>
                    <p class="hint">Elige qué hacer esta semana:</p>
                    <button onclick="avanzarSemana('striking')" class="btn-action">🥊 Entrenar Striking</button>
                    <button onclick="avanzarSemana('grappling')" class="btn-action">🥋 Entrenar Grappling</button>
                    <button onclick="avanzarSemana('descanso')" class="btn-rest">🛌 Descansar / Recuperar</button>
                </div>
            </div>

            <div class="log-container">
                <div id="log-box"></div>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
